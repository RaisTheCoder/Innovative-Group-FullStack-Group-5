<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div class="timer">
        <div id="clock">
          <h3>TIME</h3>
          <h1 id="timer">0:00</h1>
        </div>

        <div class="settings">
          <input
            id="minutes"
            value="1"
            max="60"
            type="number"
            placeholder="Minutes"
          />
          <input id="seconds" type="number" max="60" placeholder="Seconds" />
        </div>

        <button id="start-pause-stop">START</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
