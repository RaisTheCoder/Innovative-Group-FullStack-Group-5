<!doctype html>

  <body>
    <header>
      <div class="branding">
        <a href="index.html">
          <img
            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftr.rbxcdn.com%2F180DAY-d4271f7554d90f49e579c07042473385%2F420%2F420%2FDecal%2FWebp%2FnoFilter&f=1&nofb=1&ipt=d8739d4ae9a70f38ee297f0ea9ef854911712ec382d40783c30a423e01299933"
            alt="Badware"

      </div>

      <hr />

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html" class="current-page">BadWares</a></li>
          <li><a href="about.html">About</a></li>
        </ul>

        <div class="nav-right">
          <input type="text" id="search" placeholder="Search Items" />
          <p id="now-playing">NOW PLAYING: Select the Method</p>
          <button id="cart-btn">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count"></span>
          </button>

        </div>
      </nav>
    </header>
    <main>
      <section id="products">
        <template id="ProdTemplate">
          <article class="product">
            <img
              class="prod-image"
              src="./assets/image/gpu-placeholder.jpg"
              alt=""
            />

            <div class="info">
              <strong class="prod-name">PRODUCT</strong>
              <p class="prod-price">
                000P

                  alt=""
                />
              </p>
            </div>

            <div class="buttons">
              <button class="buy">BUY</button>
              <button class="add">ADD TO CART</button>
              <button class="fav">FAVORITE</button>
            </div>
          </article>
        </template>
      </section>
    </main>
    <footer>Copyright @ BadWare 2026 All Rights Reserved.</footer>
    <script src="./assets/js/cart.js"></script>
